app = "your-app-name"   # must be unique on Fly.io
primary_region = "sin"  # Singapore (best low latency from India)

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  SERVER_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false   # IMPORTANT: prevents sleep
  min_machines_running = 1     # always-on (free tier allows 1)

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
